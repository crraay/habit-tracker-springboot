name: deploy-image-digital-ocean

on:
  workflow_run:
    workflows:
      - build-image
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_SSH_PORT || 22 }}
          timeout: 2m
          command_timeout: ${{ vars.DEPLOY_SSH_COMMAND_TIMEOUT || '15m' }}
          script: |
            set -euo pipefail
            BACKEND_DIR='${{ vars.DEPLOY_BACKEND_DIR || '/app/habit-tracker-springboot' }}'
            if [ ! -d "$BACKEND_DIR" ]; then
              echo "ERROR: backend directory not found: $BACKEND_DIR"
              echo "Create it (see DOCKER.md) or set repo variable DEPLOY_BACKEND_DIR to your clone path."
              exit 1
            fi
            cd "$BACKEND_DIR"
            git pull --ff-only
            if docker compose version >/dev/null 2>&1; then
              docker compose pull backend
              docker compose up -d backend
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose pull backend
              docker-compose up -d backend
            else
              echo "ERROR: Neither 'docker compose' nor 'docker-compose' is available."
              echo "On Ubuntu/Debian: sudo apt-get install -y docker-compose-plugin"
              exit 1
            fi
