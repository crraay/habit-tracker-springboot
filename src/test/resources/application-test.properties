# Test Configuration for Spring Boot Tests

# Application name
spring.application.name=habit-tracker

# Test database - using in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate settings for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JWT properties for testing
jwt.secret=test-secret-key-for-unit-tests-should-be-at-least-256-bits-long
jwt.token.expires.in=1800000

# CORS configuration for testing
cors.allowed-origins=http://localhost:4200,http://localhost:3000
cors.allowed-methods=HEAD,GET,POST,PUT,DELETE,PATCH
cors.allowed-headers=Authorization,Cache-Control,Content-Type

# Disable Swagger for tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.default-produces-media-type=application/json

# Logging for tests
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
